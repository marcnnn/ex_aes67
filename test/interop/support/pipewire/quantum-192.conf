# 4 ms graph cycle: the rtp-sink buffers 384 frames (overruns at the default quantum of 1024), and
# a non-realtime PipeWire in a container glitches at 1 ms cycles
context.properties = {
  default.clock.rate = 48000
  default.clock.quantum = 192
  default.clock.min-quantum = 192
  default.clock.max-quantum = 192
}
